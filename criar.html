<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneat - Criar Publicação</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        body.dark-create-theme {
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header com fundo preto e linha fina transparente de divisão */
        .create-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            z-index: 20;
            background: #000000;
            width: 100%;
            box-sizing: border-box;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); /* Linha fina transparente */
        }

        .btn-close {
            background: none;
            border: none;
            color: #ffffff;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .type-selector-tabs {
            display: flex;
            gap: 24px;
            align-items: center;
            justify-content: center;
            flex: 1;
        }

        .type-tab {
            background: none;
            border: none;
            color: #8e8e93;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            padding: 6px 0;
            transition: color 0.2s;
            position: relative;
            letter-spacing: 0.5px;
        }

        .type-tab.active {
            color: #ffffff;
        }

        .type-tab.active::after {
            content: '';
            position: absolute;
            bottom: -13px;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #ffffff;
        }

        .header-right-controls {
            display: flex;
            align-items: center;
            flex-shrink: 0;
        }

        .icon-btn-header {
            background: none;
            border: none;
            color: #ffffff;
            padding: 4px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        /* Área principal e preview */
        .create-main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
            background: #000000;
        }

        .gallery-title-bar {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            background: none;
            border: none;
            padding: 0;
        }

        .create-preview-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            background: #000000;
        }

        .create-preview-area video, 
        .create-preview-area img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .empty-preview-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            color: #8e8e93;
            text-align: center;
        }

        .empty-preview-icon {
            color: #8e8e93;
            opacity: 0.6;
        }

        .empty-preview-text {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
        }

        /* Barra Inferior com o Botão em formato de pílula oval correta (Largura fixa e harmônica) */
        .create-footer-bar {
            padding: 16px 20px 24px 20px;
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            border-top: 1px solid rgba(255, 255, 255, 0.08); /* Linha fina transparente de divisão inferior */
        }

        .btn-advance-footer {
            background-color: #ffffff;
            color: #000000;
            border: none;
            font-size: 16px;
            font-weight: 700;
            cursor: not-allowed;
            padding: 12px 0;
            width: 260px; /* Largura fixa controlada para formar a pílula oval perfeita */
            height: 48px;
            border-radius: 28px; /* Bordas arredondadas proporcionais */
            transition: 0.2s;
            text-align: center;
            opacity: 0.35;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-advance-footer.active {
            opacity: 1;
            cursor: pointer;
        }

        .btn-advance-footer.active:active {
            transform: scale(0.97);
        }

        /* Modais */
        .caption-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }

        .caption-modal.show { display: flex; }

        .caption-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .caption-header h2 { font-size: 18px; margin: 0; font-weight: 700; }

        .btn-back-caption, .btn-publish-final {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-publish-final { color: #00ff88; }

        .caption-body {
            display: flex;
            gap: 16px;
            align-items: flex-start;
        }

        .caption-thumbnail {
            width: 84px;
            height: 84px;
            border-radius: 12px;
            object-fit: cover;
            background: #222222;
        }

        .caption-textarea {
            flex: 1;
            height: 120px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .caption-textarea::placeholder { color: #8e8e93; }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(8px);
            z-index: 200;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .loading-overlay.show { display: flex; }

        .loading-box {
            background: #18181b;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 24px 28px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            text-align: center;
        }

        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top-color: #00ff88;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 15px;
            font-weight: 600;
            color: #ffffff;
        }
    </style>
</head>
<body class="dark-create-theme">

    <!-- Header com fundo preto e linhas finas -->
    <header class="create-header">
        <a href="./passo1.html" class="btn-close" aria-label="Fechar">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        </a>

        <div class="type-selector-tabs">
            <button type="button" class="type-tab active" data-type="post">POST</button>
            <button type="button" class="type-tab" data-type="video">VÍDEO</button>
            <button type="button" class="type-tab" data-type="viral">VIRAL</button>
        </div>

        <div class="header-right-controls">
            <button type="button" class="icon-btn-header" aria-label="Seleção Múltipla">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"></rect><path d="M9 3v18"></path></svg>
            </button>
        </div>
    </header>

    <!-- Área de Preview -->
    <main class="create-main-container">
        <button type="button" class="gallery-title-bar" id="gallerySelectorBtn">
            Galeria
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </button>

        <div class="create-preview-area" id="previewContainer">
            <div class="empty-preview-state" id="emptyStateDisplay">
                <div class="empty-preview-icon">
                    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>
                </div>
                <p class="empty-preview-text">Capture o momento com um amigo</p>
            </div>
        </div>
    </main>

    <!-- Barra Inferior com o Botão Pílula Avançar Correto -->
    <footer class="create-footer-bar">
        <button type="button" class="btn-advance-footer" id="btnAdvanceFooter">Avançar</button>
    </footer>

    <!-- Modais -->
    <div class="caption-modal" id="captionModal">
        <div class="caption-header">
            <button type="button" class="btn-back-caption" id="closeModalBtn">Voltar</button>
            <h2>Nova publicação</h2>
            <button type="button" class="btn-publish-final" id="publishFinalBtn">Compartilhar</button>
        </div>
        <div class="caption-body">
            <img id="modalThumbnail" class="caption-thumbnail" src="" alt="Thumbnail">
            <textarea id="postCaptionInput" class="caption-textarea" placeholder="Escreva uma legenda..."></textarea>
        </div>
    </div>

    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-box">
            <div class="spinner"></div>
            <span class="loading-text">Publicando...</span>
        </div>
    </div>

    <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;">

    <script>
        let selectedType = 'post';
        let mediaDataUrl = null;
        let mediaType = null;

        const tabs = document.querySelectorAll('.type-tab');
        const fileInput = document.getElementById('fileInput');
        const previewContainer = document.getElementById('previewContainer');
        const emptyStateDisplay = document.getElementById('emptyStateDisplay');
        const gallerySelectorBtn = document.getElementById('gallerySelectorBtn');
        const btnAdvanceFooter = document.getElementById('btnAdvanceFooter');

        const captionModal = document.getElementById('captionModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const publishFinalBtn = document.getElementById('publishFinalBtn');
        const modalThumbnail = document.getElementById('modalThumbnail');
        const postCaptionInput = document.getElementById('postCaptionInput');
        const loadingOverlay = document.getElementById('loadingOverlay');

        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
                selectedType = tab.getAttribute('data-type');
                
                const emptyText = document.querySelector('.empty-preview-text');
                if (selectedType === 'post') emptyText.textContent = 'Capture o momento com um amigo';
                if (selectedType === 'video') emptyText.textContent = 'Grave ou selecione um vídeo';
                if (selectedType === 'viral') emptyText.textContent = 'Crie um vídeo viral';
            });
        });

        previewContainer.addEventListener('click', (e) => {
            if (e.target === previewContainer || e.target === emptyStateDisplay || emptyStateDisplay.contains(e.target)) {
                fileInput.click();
            }
        });
        gallerySelectorBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(uploadEvent) {
                mediaDataUrl = uploadEvent.target.result;
                const isVideo = file.type.startsWith('video');
                mediaType = isVideo ? 'video' : 'image';

                emptyStateDisplay.style.display = 'none';

                if (isVideo) {
                    previewContainer.innerHTML = `<video src="${mediaDataUrl}" controls autoplay playsinline style="width: 100%; height: 100%; object-fit: contain;"></video>`;
                } else {
                    previewContainer.innerHTML = `<img src="${mediaDataUrl}" style="width: 100%; height: 100%; object-fit: contain;" />`;
                }
                
                previewContainer.appendChild(gallerySelectorBtn);

                modalThumbnail.src = mediaDataUrl;
                btnAdvanceFooter.classList.add('active');
            };
            reader.readAsDataURL(file);
        });

        btnAdvanceFooter.addEventListener('click', () => {
            if (!mediaDataUrl) return;
            captionModal.classList.add('show');
        });

        closeModalBtn.addEventListener('click', () => {
            captionModal.classList.remove('show');
        });

        publishFinalBtn.addEventListener('click', () => {
            if (!mediaDataUrl) return;

            loadingOverlay.classList.add('show');
            const caption = postCaptionInput.value.trim();
            const uniqueId = 'post_' + Date.now();

            // Executa o salvamento de forma leve usando setTimeout para evitar travamento de UI
            setTimeout(() => {
                try {
                    const postData = {
                        id: uniqueId,
                        url: mediaDataUrl,
                        type: mediaType,
                        author: 'Eributtler',
                        caption: caption
                    };

                    // 1. Salva sempre no perfil do usuário
                    const userPosts = JSON.parse(localStorage.getItem('koneat_user_posts') || '[]');
                    userPosts.unshift(postData);
                    localStorage.setItem('koneat_user_posts', JSON.stringify(userPosts));

                    // 2. Se for vídeo ou selecionado na aba VIRAL, vai direto para o feed viral (passo2.html)
                    if (mediaType === 'video' || selectedType === 'viral') {
                        const currentVirais = JSON.parse(localStorage.getItem('koneat_virais_feed') || '[]');
                        currentVirais.unshift(postData);
                        localStorage.setItem('koneat_virais_feed', JSON.stringify(currentVirais));
                    }

                    loadingOverlay.classList.remove('show');

                    // Direcionamento correto após publicar
                    if (mediaType === 'video' || selectedType === 'viral') {
                        window.location.href = './passo2.html';
                    } else {
                        window.location.href = './passo1.html';
                    }
                } catch (err) {
                    console.error("Erro ao salvar post:", err);
                    alert("O arquivo é muito grande para o armazenamento local. Tente um arquivo menor.");
                    loadingOverlay.classList.remove('show');
                }
            }, 300);
        });
    </script>
</body>
</html>
