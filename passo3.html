<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

<title>Koneat - Criar Publicação</title>
<link rel="stylesheet" href="css/style.css">

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

html, body.dark-create-theme {
    width: 100%;
    height: 100%;
    height: 100dvh;
    margin: 0;
    padding: 0;
    overflow: hidden !important;
    overscroll-behavior: none;
    background: #000;
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body.dark-create-theme {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
}

/* CABEÇALHO */

.create-header {
    height: clamp(76px, 12vh, 106px);
    min-height: 76px;
    flex-shrink: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 36px;
    background: #000;
    border-bottom: 1px solid rgba(255,255,255,.12);
    z-index: 20;
}

.btn-close {
    width: 34px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    background: none;
    border: none;
    text-decoration: none;
    flex-shrink: 0;
}

.type-selector-tabs {
    flex: 1;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
}

.type-tab {
    position: relative;
    height: 100%;
    min-width: 33.33%;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: none;
    color: #aeb4c0;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    white-space: nowrap;
}

.type-tab + .type-tab {
    border-left: 1px solid rgba(255,255,255,.17);
    height: 30px;
}

.type-tab.active {
    color: #fff;
}

.type-tab.active::after {
    content: "";
    position: absolute;
    height: 4px;
    bottom: 0;
    left: 0;
    right: 0;
    background: #fff;
}

.header-right-placeholder {
    width: 24px;
    flex-shrink: 0;
}

/* ÁREA PRINCIPAL */

.create-main-container {
    flex: 1;
    min-height: 0;
    width: 100%;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #000;
}

/* GALERIA E ÍCONES SUPERIORES */

.top-action-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 82px;
    padding: 0 38px;
    z-index: 15;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #000;
}

.gallery-title-bar {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #fff;
    font-size: 19px;
    font-weight: 500;
    background: none;
    border: none;
    padding: 8px 0;
    cursor: pointer;
}

.right-top-icons {
    display: flex;
    align-items: center;
    gap: 24px;
}

.icon-circle-btn {
    width: 76px;
    height: 76px;
    border-radius: 50%;
    background: #202023;
    border: 1px solid rgba(255,255,255,.05);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
}

.icon-circle-btn svg {
    width: 34px;
    height: 34px;
}

.icon-circle-btn:active {
    background: #333;
    transform: scale(.96);
}

/* PREVIEW */

.create-preview-area {
    flex: 1;
    min-height: 0;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    background: #000;
    padding: 82px 12px 8px;
}

.create-preview-area img,
.create-preview-area video {
    display: block;
    width: 100%;
    height: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
}

.create-preview-area video {
    background: #000;
}

/* ESTADO VAZIO */

.empty-preview-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 28px;
    width: 100%;
    text-align: center;
    color: #aeb4c0;
}

.empty-preview-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: .9;
}

.empty-preview-icon svg {
    width: 90px;
    height: 90px;
}

.empty-preview-text {
    margin: 0;
    font-size: 19px;
    font-weight: 400;
    color: #aeb4c0;
}

/* RODAPÉ: BOTÃO AVANÇAR */

.create-footer-bar {
    width: 100%;
    height: 132px;
    min-height: 100px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 20px 22px;
    background: #000;
    z-index: 30;
}

.btn-advance-footer {
    width: min(50%, 424px);
    min-width: 240px;
    height: 94px;
    max-height: 64px;
    border: none;
    border-radius: 60px;
    background: #fff;
    color: #000;
    font-size: 22px;
    font-weight: 700;
    cursor: not-allowed;
    opacity: .45;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform .2s, opacity .2s;
}

.btn-advance-footer.active {
    opacity: 1;
    cursor: pointer;
}

.btn-advance-footer.active:active {
    transform: scale(.97);
}

/* NAVEGAÇÃO INFERIOR */

.bottom-nav-fixed {
    position: relative;
    width: 100%;
    height: calc(66px + env(safe-area-inset-bottom));
    min-height: 66px;
    flex-shrink: 0;
    padding: 0 10px env(safe-area-inset-bottom);
    background: #000;
    border-top: 1px solid rgba(255,255,255,.12);
    display: flex;
    align-items: center;
    justify-content: space-around;
    z-index: 40;
}

.nav-link {
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aeb4c0;
    text-decoration: none;
    background: none;
    border: none;
}

.nav-link svg {
    width: 54px;
    height: 54px;
}

.nav-link.active-create {
    color: #fff;
}

.nav-link.active-create .create-box-filled {
    fill: #fff;
}

.nav-link.active-create .create-plus-inner {
    stroke: #000;
}

/* MODAL */

.caption-modal {
    position: fixed;
    inset: 0;
    z-index: 100;
    display: none;
    flex-direction: column;
    padding:
        calc(20px + env(safe-area-inset-top))
        20px
        calc(20px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,.98);
    overflow: hidden;
}

.caption-modal.show {
    display: flex;
}

.caption-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    min-height: 46px;
    margin-bottom: 24px;
}

.caption-header h2 {
    font-size: 18px;
    margin: 0;
    font-weight: 700;
}

.btn-back-caption,
.btn-publish-final {
    background: none;
    border: none;
    color: #fff;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
}

.btn-publish-final {
    color: #00ff88;
}

.caption-body {
    display: flex;
    gap: 16px;
    align-items: flex-start;
}

.caption-thumbnail {
    width: 84px;
    height: 84px;
    border-radius: 12px;
    object-fit: cover;
    background: #222;
}

.caption-textarea {
    flex: 1;
    height: 120px;
    background: transparent;
    border: none;
    color: #fff;
    font-size: 15px;
    resize: none;
    outline: none;
    font-family: inherit;
}

.caption-textarea::placeholder {
    color: #8e8e93;
}

/* CARREGAMENTO */

.loading-overlay {
    position: fixed;
    inset: 0;
    z-index: 200;
    background: rgba(0,0,0,.88);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
}

.loading-overlay.show {
    display: flex;
}

.loading-box {
    background: #18181b;
    border: 1px solid rgba(255,255,255,.1);
    padding: 24px 28px;
    border-radius: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
}

.spinner {
    width: 32px;
    height: 32px;
    border: 3px solid rgba(255,255,255,.2);
    border-top-color: #00ff88;
    border-radius: 50%;
    animation: spin .8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

.loading-text {
    font-size: 15px;
    font-weight: 600;
    color: #fff;
}

/* AJUSTES PARA CELULARES PEQUENOS */

@media (max-width: 420px) {
    .create-header {
        padding: 0 16px;
    }

    .type-tab {
        font-size: 14px;
        padding: 0 8px;
    }

    .top-action-bar {
        padding: 0 20px;
    }

    .right-top-icons {
        gap: 12px;
    }

    .icon-circle-btn {
        width: 54px;
        height: 54px;
    }

    .icon-circle-btn svg {
        width: 27px;
        height: 27px;
    }

    .gallery-title-bar {
        font-size: 18px;
    }

    .btn-advance-footer {
        width: 55%;
        min-width: 220px;
        height: 58px;
        font-size: 20px;
    }

    .create-footer-bar {
        height: 110px;
        min-height: 90px;
        padding-bottom: 12px;
    }

    .nav-link svg {
        width: 48px;
        height: 48px;
    }
}

/* CELULARES COM POUCA ALTURA */

@media (max-height: 650px) {
    .create-header {
        height: 70px;
        min-height: 70px;
    }

    .top-action-bar {
        height: 64px;
    }

    .create-preview-area {
        padding-top: 64px;
    }

    .icon-circle-btn {
        width: 46px;
        height: 46px;
    }

    .icon-circle-btn svg {
        width: 25px;
        height: 25px;
    }

    .create-footer-bar {
        height: 82px;
        min-height: 82px;
        padding: 5px 15px 10px;
    }

    .btn-advance-footer {
        height: 52px;
        min-width: 210px;
        font-size: 18px;
    }

    .bottom-nav-fixed {
        height: calc(58px + env(safe-area-inset-bottom));
        min-height: 58px;
    }

    .nav-link svg {
        width: 42px;
        height: 42px;
    }
}
</style>
</head>

       id="fileInput"
       accept="image/*,video/*"

<script>
let selectedType = 'post';
let mediaDataUrl = null;
let mediaType = null;

const tabs = document.querySelectorAll('.type-tab');

const fileInput = document.getElementById('fileInput');
const previewContainer = document.getElementById('previewContainer');
const emptyStateDisplay = document.getElementById('emptyStateDisplay');

const gallerySelectorBtn = document.getElementById('gallerySelectorBtn');
const cameraIconBtn = document.getElementById('cameraIconBtn');
const btnAdvanceFooter = document.getElementById('btnAdvanceFooter');

const captionModal = document.getElementById('captionModal');
const closeModalBtn = document.getElementById('closeModalBtn');
const publishFinalBtn = document.getElementById('publishFinalBtn');

const modalThumbnail = document.getElementById('modalThumbnail');
const postCaptionInput = document.getElementById('postCaptionInput');
const loadingOverlay = document.getElementById('loadingOverlay');

/* TROCA DE ABAS */

tabs.forEach(tab => {

    tab.addEventListener('click', () => {

        tabs.forEach(t => t.classList.remove('active'));

        tab.classList.add('active');

        selectedType = tab.dataset.type;

        const emptyText = document.querySelector('.empty-preview-text');

        if (emptyText) {

            if (selectedType === 'post') {
                emptyText.textContent = 'Faça um post no feed';
            }

            if (selectedType === 'story') {
                emptyText.textContent = 'Crie um story';
            }

            if (selectedType === 'video') {
                emptyText.textContent = 'Grave ou selecione um vídeo';
            }

        }

    });

});

/* ABRIR GALERIA */

function triggerGallery() {
    fileInput.click();
}

gallerySelectorBtn.addEventListener('click', triggerGallery);
cameraIconBtn.addEventListener('click', triggerGallery);

/* CLICAR NA ÁREA VAZIA */

previewContainer.addEventListener('click', event => {

    if (
        event.target === emptyStateDisplay ||
        emptyStateDisplay.contains(event.target)
    ) {
        triggerGallery();
    }

});

/* SELEÇÃO DE ARQUIVOS */

fileInput.addEventListener('change', event => {

    const file = event.target.files[0];

    if (!file) return;

    const isVideo = file.type.startsWith('video');
    const isImage = file.type.startsWith('image');

    const fileSizeMB = file.size / (1024 * 1024);

    if (!isVideo && !isImage) {
        alert('Formato de arquivo não permitido.');
        fileInput.value = '';
        return;
    }

    /* LIMITE DE IMAGEM */

    if (isImage && fileSizeMB > 10) {

        alert('A imagem é muito grande. O limite máximo é 10MB.');

        fileInput.value = '';
        return;

    }

    /* LIMITE DE VÍDEO */

    if (isVideo && fileSizeMB > 100) {

        alert('O vídeo excede o limite de 100MB.');

        fileInput.value = '';
        return;

    }

    /* VERIFICAÇÃO DE DURAÇÃO */

    if (isVideo) {

        const tempVideo = document.createElement('video');

        const objectUrl = URL.createObjectURL(file);

        tempVideo.preload = 'metadata';

        tempVideo.onloadedmetadata = function() {

            const duration = tempVideo.duration;

            URL.revokeObjectURL(objectUrl);

            if (selectedType === 'video' && duration > 185) {

                alert('O vídeo ultrapassa o limite de 3 minutos.');

                fileInput.value = '';
                return;

            }

            processFile(file);

        };

        temp
