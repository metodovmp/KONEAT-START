<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>Koneat - Criar publicação</title>

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            margin: 0;
            background: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
        }

        button, a {
            font: inherit;
        }

        /* CABEÇALHO */

        .create-header {
            width: 100%;
            height: 106px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #292929;
            position: relative;
        }

        .close-link {
            width: 100px;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            text-decoration: none;
            flex-shrink: 0;
        }

        .close-link svg {
            width: 43px;
            height: 43px;
        }

        .create-tabs {
            height: 100%;
            flex: 1;
            display: flex;
            align-items: stretch;
            justify-content: center;
            padding-right: 15px;
        }

        .create-tab {
            position: relative;
            min-width: 33.33%;
            height: 100%;
            border: 0;
            background: transparent;
            color: #aeb3bd;
            font-size: 23px;
            font-weight: 500;
            cursor: pointer;
        }

        .create-tab + .create-tab::before {
            content: "";
            position: absolute;
            left: 0;
            top: 45%;
            height: 30px;
            width: 1px;
            background: #353535;
            transform: translateY(-50%);
        }

        .create-tab.active {
            color: #ffffff;
        }

        .create-tab.active::after {
            content: "";
            position: absolute;
            height: 5px;
            background: #ffffff;
            left: 0;
            right: 0;
            bottom: 0;
        }

        /* GALERIA E FERRAMENTAS */

        .gallery-toolbar {
            height: 105px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 38px;
        }

        .gallery-select {
            display: flex;
            align-items: center;
            gap: 17px;
            border: 0;
            padding: 0;
            background: transparent;
            color: #ffffff;
            font-size: 30px;
            cursor: pointer;
        }

        .gallery-select svg {
            width: 24px;
            height: 24px;
        }

        .toolbar-actions {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .round-tool {
            width: 76px;
            height: 76px;
            border: 0;
            border-radius: 50%;
            background: #242424;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .round-tool svg {
            width: 43px;
            height: 43px;
        }

        /* SELEÇÃO DE ARQUIVOS */

        input[type="file"] {
            display: none;
        }

        /* ÁREA CENTRAL */

        .media-area {
            position: fixed;
            top: 196px;
            left: 0;
            right: 0;
            bottom: calc(110px + env(safe-area-inset-bottom) + 125px);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 10px 18px;
        }

        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 35px;
            color: #aeb7c3;
            text-align: center;
        }

        .empty-state svg {
            width: 112px;
            height: 112px;
        }

        .empty-state p {
            margin: 0;
            font-size: 36px;
            font-weight: 400;
        }

        .media-preview {
            display: none;
            width: 100%;
            height: 100%;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        /* BOTÃO AVANÇAR */

        .advance-button {
            position: fixed;
            left: 50%;
            bottom: calc(110px + env(safe-area-inset-bottom) + 22px);
            transform: translateX(-50%);
            width: min(55%, 425px);
            min-width: 280px;
            height: 76px;
            border: 0;
            border-radius: 60px;
            background: #ffffff;
            color: #000000;
            font-size: 27px;
            font-weight: 700;
            cursor: pointer;
            z-index: 30;
        }

        /* NAVEGAÇÃO INFERIOR */

        .bottom-nav {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: calc(110px + env(safe-area-inset-bottom));
            padding: 0 20px env(safe-area-inset-bottom);
            background: #000000;
            border-top: 1px solid #292929;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 40;
        }

        .nav-link {
            width: 58px;
            height: 58px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #aeb7c3;
            text-decoration: none;
            flex-shrink: 0;
        }

        .nav-link svg {
            width: 46px;
            height: 46px;
        }

        .nav-link.active {
            width: 58px;
            height: 58px;
            border-radius: 15px;
            background: #ffffff;
            color: #000000;
        }

        .nav-link.active svg {
            width: 43px;
            height: 43px;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 500px) {
            .create-header {
                height: 90px;
            }

            .close-link {
                width: 75px;
            }

            .close-link svg {
                width: 38px;
                height: 38px;
            }

            .create-tab {
                font-size: 18px;
            }

            .gallery-toolbar {
                height: 90px;
                padding: 0 25px;
            }

            .gallery-select {
                font-size: 25px;
            }

            .toolbar-actions {
                gap: 15px;
            }

            .round-tool {
                width: 62px;
                height: 62px;
            }

            .round-tool svg {
                width: 35px;
                height: 35px;
            }

            .media-area {
                top: 180px;
                bottom: calc(110px + env(safe-area-inset-bottom) + 125px);
            }

            .empty-state {
                gap: 28px;
            }

            .empty-state svg {
                width: 90px;
                height: 90px;
            }

            .empty-state p {
                font-size: 27px;
            }

            .advance-button {
                bottom: calc(110px + env(safe-area-inset-bottom) + 22px);
                width: 55%;
                min-width: 0;
                height: 76px;
                font-size: 25px;
            }

            .bottom-nav {
                height: calc(110px + env(safe-area-inset-bottom));
                padding-left: 20px;
                padding-right: 20px;
            }
        }

        @media (max-height: 650px) {
            .media-area {
                top: 155px;
                bottom: calc(95px + env(safe-area-inset-bottom) + 100px);
            }

            .advance-button {
                height: 60px;
                bottom: calc(95px + env(safe-area-inset-bottom) + 15px);
            }

            .bottom-nav {
                height: calc(95px + env(safe-area-inset-bottom));
            }

            .empty-state {
                gap: 15px;
            }

            .empty-state svg {
                width: 70px;
                height: 70px;
            }

            .empty-state p {
                font-size: 23px;
            }
        }
    </style>
</head>

<body>

    <!-- CABEÇALHO -->

    <header class="create-header">

        <a href="./passo4.html"
           class="close-link"
           aria-label="Fechar">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8">
                <line x1="4" y1="4" x2="20" y2="20"/>
                <line x1="20" y1="4" x2="4" y2="20"/>
            </svg>

        </a>

        <nav class="create-tabs">

            <button class="create-tab active" data-type="post">
                POST
            </button>

            <button class="create-tab" data-type="story">
                STORY
            </button>

            <button class="create-tab" data-type="video">
                VÍDEO
            </button>

        </nav>

    </header>

    <!-- GALERIA -->

    <section class="gallery-toolbar">

        <button class="gallery-select" id="openGallery">
            Galeria

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.5">
                <polyline points="6 9 12 15 18 9"/>
            </svg>
        </button>

        <div class="toolbar-actions">

            <button class="round-tool"
                    id="openGalleryIcon"
                    aria-label="Abrir galeria">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">
                    <rect x="3" y="3" width="15" height="15" rx="2"/>
                    <path d="M8 7h11a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
                </svg>

            </button>

            <button class="round-tool"
                    id="openCamera"
                    aria-label="Abrir câmera">

                <svg viewBox="0 0 24 24"
                     fill="none"
                     stroke="currentColor"
                     stroke-width="1.8">
                    <path d="M3 7h4l2-3h6l2 3h4a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>

            </button>

        </div>

    </section>

    <!-- INPUTS -->

    <input type="file"
           id="galleryInput"
           accept="image/*,video/*">

    <input type="file"
           id="cameraInput"
           accept="image/*"
           capture="environment">

    <!-- ÁREA CENTRAL -->

    <main class="media-area">

        <div class="empty-state" id="emptyState">

            <svg viewBox="0 0 100 100"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="3.5"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <rect x="9" y="25" width="65" height="61" rx="11"/>
                <path d="M20 25v-7a9 9 0 0 1 10-9l49 4a9 9 0 0 1 8 10l-5 43a9 9 0 0 1-8 8"/>
                <circle cx="29" cy="46" r="7"/>
                <path d="M31 73l17-16 13 13"/>

            </svg>

            <p>Faça um post no feed</p>

        </div>

        <img id="imagePreview"
             class="media-preview"
             alt="Prévia da publicação">

        <video id="videoPreview"
               class="media-preview"
               controls
               playsinline>
        </video>

    </main>

    <!-- AVANÇAR -->

    <button class="advance-button" id="advanceButton">
        Avançar
    </button>

    <!-- NAVEGAÇÃO INFERIOR -->

    <nav class="bottom-nav">

        <!-- HOME: NAVEGAÇÃO 4 -->

        <a href="./passo4.html"
           class="nav-link"
           aria-label="Home">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 stroke-linecap="round"
                 stroke-linejoin="round">

                <path d="M3 10.5 12 3l9 7.5V21a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>

            </svg>

        </a>

        <!-- PLUS: NAVEGAÇÃO 3 -->

        <a href="./passo3.html"
           class="nav-link active"
           aria-label="Criar publicação">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="2.5"
                 stroke-linecap="round">

                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>

            </svg>

        </a>

        <!-- VÍDEOS: NAVEGAÇÃO 2 -->

        <a href="./passo2.html"
           class="nav-link"
           aria-label="Vídeos">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 stroke-linejoin="round">

                <rect x="2" y="2" width="20" height="20" rx="5"/>
                <polygon points="10,8 16,12 10,16"/>

            </svg>

        </a>

        <!-- PERFIL: NAVEGAÇÃO 1 -->

        <a href="./passo1.html"
           class="nav-link"
           aria-label="Perfil">

            <svg viewBox="0 0 24 24"
                 fill="none"
                 stroke="currentColor"
                 stroke-width="1.8"
                 stroke-linecap="round">

                <circle cx="12" cy="7" r="4"/>
                <path d="M4 21v-2a8 8 0 0 1 16 0v2"/>

            </svg>

        </a>

    </nav>

    <!-- JAVASCRIPT -->

    <script>

        const galleryInput =
            document.getElementById("galleryInput");

        const cameraInput =
            document.getElementById("cameraInput");

        const emptyState =
            document.getElementById("emptyState");

        const imagePreview =
            document.getElementById("imagePreview");

        const videoPreview =
            document.getElementById("videoPreview");

        let selectedFile = null;
        let currentMediaUrl = null;

        /* ABRIR GALERIA */

        document.getElementById("openGallery")
            .addEventListener("click", () => {
                galleryInput.click();
            });

        document.getElementById("openGalleryIcon")
            .addEventListener("click", () => {
                galleryInput.click();
            });

        /* ABRIR CÂMERA */

        document.getElementById("openCamera")
            .addEventListener("click", () => {
                cameraInput.click();
            });

        /* MOSTRAR MÍDIA SELECIONADA */

        function showSelectedMedia(file) {

            if (!file) return;

            if (!file.type.startsWith("image/") &&
                !file.type.startsWith("video/")) {
                return;
            }

            selectedFile = file;

            if (currentMediaUrl) {
                URL.revokeObjectURL(currentMediaUrl);
            }

            currentMediaUrl = URL.createObjectURL(file);

            emptyState.style.display = "none";

            imagePreview.style.display = "none";
            videoPreview.style.display = "none";

            if (file.type.startsWith("video/")) {

                imagePreview.removeAttribute("src");
                videoPreview.src = currentMediaUrl;
                videoPreview.style.display = "block";

            } else {

                videoPreview.pause();
                videoPreview.removeAttribute("src");

                imagePreview.src = currentMediaUrl;
                imagePreview.style.display = "block";

            }
        }

        /* ARQUIVO DA GALERIA */

        galleryInput.addEventListener("change", event => {
            showSelectedMedia(event.target.files[0]);
        });

        /* ARQUIVO DA CÂMERA */

        cameraInput.addEventListener("change", event => {
            showSelectedMedia(event.target.files[0]);
        });

        /* ABAS POST / STORY / VÍDEO */

        document.querySelectorAll(".create-tab")
            .forEach(tab => {

                tab.addEventListener("click", () => {

                    document.querySelectorAll(".create-tab")
                        .forEach(item => {
                            item.classList.remove("active");
                        });

                    tab.classList.add("active");

                });

            });

        /* AVANÇAR PARA A NAVEGAÇÃO 4 */

        document.getElementById("advanceButton")
            .addEventListener("click", () => {

                if (!selectedFile) {
                    galleryInput.click();
                    return;
                }

                window.location.href = "./passo4.html";

            });

    </script>

</body>
</html>
