<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#ffffff">
    <title>Koneat - Home</title>

    <link rel="stylesheet" href="css/style.css">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html {
            width: 100%;
            min-height: 100%;
            background: #ffffff;
        }

        body.light-home-theme {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            min-height: 100dvh;
            background: #ffffff;
            color: #000000;
            font-family: -apple-system, BlinkMacSystemFont,
                "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            padding-bottom: calc(76px + env(safe-area-inset-bottom));
        }

        button {
            font-family: inherit;
        }

        /* CABEÇALHO KONEAT */
        .home-header {
            position: sticky;
            top: 0;
            left: 0;
            width: 100%;
            height: 64px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            z-index: 100;
            border-bottom: 1px solid #eeeeee;
        }

        .home-logo {
            margin: 0;
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -1.2px;
            color: #000000;
        }

        .home-header-icons {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .icon-top-btn {
            width: 30px;
            height: 38px;
            background: none;
            border: none;
            color: #000000;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .icon-top-btn svg {
            width: 27px;
            height: 27px;
        }

        /* ABAS SUPERIORES */
        .home-subnav {
            position: sticky;
            top: 64px;
            width: 100%;
            height: 44px;
            background: #ffffff;
            display: flex;
            align-items: stretch;
            justify-content: flex-start;
            gap: 35px;
            padding: 0 18px;
            z-index: 90;
            border-bottom: 1px solid #eeeeee;
        }

        .subnav-tab {
            position: relative;
            height: 100%;
            background: none;
            border: none;
            padding: 0;
            font-size: 15px;
            font-weight: 500;
            color: #85858f;
            cursor: pointer;
            white-space: nowrap;
        }

        .subnav-tab.active {
            color: #000000;
            font-weight: 800;
        }

        .subnav-tab.active::after {
            content: "";
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: #000000;
            border-radius: 3px;
        }

        /* FEED PRINCIPAL */
        .home-feed-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 0;
            background: #ffffff;
        }

        /* STORIES */
        .stories-bar {
            width: 100%;
            min-height: 145px;
            display: flex;
            align-items: flex-start;
            gap: 15px;
            padding: 17px 18px 13px;
            overflow-x: auto;
            overflow-y: hidden;
            background: #ffffff;
            border-bottom: 1px solid #eeeeee;
            scrollbar-width: none;
        }

        .stories-bar::-webkit-scrollbar {
            display: none;
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 7px;
            flex-shrink: 0;
            cursor: pointer;
            min-width: 76px;
        }

        .story-avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #e9e9ee;
            border: 2px solid #111111;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .story-avatar svg {
            width: 35px;
            height: 35px;
            color: #8e8e93;
        }

        .story-add-badge {
            position: absolute;
            bottom: -3px;
            right: -4px;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #000000;
            color: #ffffff;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            font-weight: 400;
            line-height: 1;
        }

        .story-username {
            font-size: 13px;
            color: #111111;
            max-width: 80px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* PUBLICAÇÕES */
        .post-card {
            width: 100%;
            background: #ffffff;
            border-bottom: 1px solid #e5e5e5;
            padding-bottom: 8px;
            margin-bottom: 5px;
        }

        .post-header {
            width: 100%;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 18px;
        }

        .post-author-info {
            display: flex;
            align-items: center;
            gap: 12px;
            min-width: 0;
        }

        .author-avatar {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 50%;
            background: #000000;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            font-weight: 700;
        }

        .author-name {
            font-size: 16px;
            font-weight: 600;
            color: #000000;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .btn-follow-home {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 9px 22px;
            border-radius: 24px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            flex-shrink: 0;
        }

        .btn-follow-home.following {
            background: #eeeeee;
            color: #000000;
        }

        /* IMAGEM E VÍDEO */
        .post-media-wrapper {
            width: calc(100% - 36px);
            margin: 0 18px;
            aspect-ratio: 0.86 / 1;
            max-height: 75vh;
            background: #e9e8ef;
            border-radius: 15px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .post-media-wrapper img,
        .post-media-wrapper video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: cover;
            background: #e9e8ef;
        }

        .post-media-wrapper video {
            object-fit: contain;
        }

        .post-sound-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.55);
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 5;
        }

        .post-sound-btn svg {
            width: 24px;
            height: 24px;
        }

        /* AÇÕES DO POST */
        .post-actions-bar {
            width: 100%;
            min-height: 66px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 22px;
        }

        .post-actions-left {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .post-action-btn {
            background: none;
            border: none;
            padding: 0;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .post-action-btn svg {
            width: 27px;
            height: 27px;
        }

        .post-action-btn.liked {
            color: #ed3150;
        }

        .post-action-btn.liked svg {
            fill: #ed3150;
            stroke: #ed3150;
        }

        .post-action-btn.saved svg {
            fill: #000000;
        }

        .post-caption-area {
            padding: 0 22px 12px;
            font-size: 14px;
            line-height: 1.5;
            color: #222222;
            overflow-wrap: anywhere;
        }

        .post-caption-author {
            font-weight: 700;
            margin-right: 5px;
        }

        .post-caption-text {
            font-weight: 400;
        }

        .post-likes-count {
            padding: 0 22px 5px;
            font-size: 13px;
            font-weight: 700;
        }

        /* FEED VAZIO */
        .empty-home-feed {
            width: 100%;
            text-align: center;
            padding: 55px 25px;
            color: #85858f;
            font-size: 15px;
            line-height: 1.5;
        }

        /* NAVEGAÇÃO INFERIOR UNIFICADA (Estilo Padrão 62px com caixinha preenchida) */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: 62px;
            background: #121214;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 999;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .nav-link {
            width: 48px;
            height: 48px;
            background: none;
            border: none;
            color: #8e8e93;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-link svg {
            width: 22px;
            height: 22px;
        }

        /* ESTILO DO ITEM ATIVO NA HOME (Caixinha branca preenchida com ícone preto) */
        .nav-link.active-home .nav-box-bg {
            fill: #ffffff;
        }

        .nav-link.active-home .nav-icon-inner {
            stroke: #121214;
            fill: #121214;
        }

        @media (max-width: 600px) {
            .home-feed-container {
                max-width: 650px;
                margin: 0 auto;
            }
        }
    </style>
</head>

<body class="light-home-theme">

    <!-- CABEÇALHO -->
    <header class="home-header">
        <h1 class="home-logo">koneat</h1>
        <div class="home-header-icons">

    <!-- FEED -->
    <main class="home-feed-container" id="homeFeedContainer">

        <section class="stories-bar">

    <!-- NAVEGAÇÃO INFERIOR CORRIGIDA E ALINHADA -->
    <nav class="bottom-nav-fixed">

        <a href="./passo4.html" class="nav-link active-home" aria-label="Home">

        <!-- 2. PLUS (Passo 3) -->
        <a href="./passo3.html" class="nav-link" aria-label="Criar publicação">

                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
        </a>

        <!-- 3. VÍDEOS (Passo 2) -->
        <a href="./passo2.html" class="nav-link" aria-label="Vídeos">
            <svg viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="1.8" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5"/>
                <polygon points="10,8 16,12 10,16" fill="#8e8e93"/>
            </svg>

        <!-- 4. PERFIL (Passo 1) -->
        <a href="./passo1.html" class="nav-link" aria-label="Perfil">

    </nav>

    <!-- JAVASCRIPT -->
    <script>
        const postsDynamicFeed = document.getElementById('postsDynamicFeed');
        const tabs = document.querySelectorAll('.subnav-tab');

        function getStoredArray(key) {
            try {
                const data = JSON.parse(localStorage.getItem(key) || '[]');
                return Array.isArray(data) ? data : [];
            } catch (error) {
                console.error('Erro ao ler:', key);
                return [];
            }
        }

        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char]);
        }

        function renderHomeFeed() {
            const userPosts = getStoredArray('koneat_user_posts');
            const viraisFeed = getStoredArray('koneat_virais_feed');
            const allPostsMap = new Map();

            [...userPosts, ...viraisFeed].forEach(post => {
                if (post && post.id != null) {
                    allPostsMap.set(String(post.id), post);
                }
            });

            const combinedPosts = Array.from(allPostsMap.values());

            if (combinedPosts.length === 0) {
                postsDynamicFeed.innerHTML = `
                    <div class="empty-home-feed">
                        Nenhuma publicação no momento.<br>Crie um post para começar!
                    </div>
                `;
                return;
            }

            postsDynamicFeed.innerHTML = combinedPosts.map(item => {
                const isVideo = item.type === 'video';
                const authorName = escapeHTML(item.author || 'Eributtler');
                const caption = escapeHTML(item.caption || '');
                const postId = escapeHTML(item.id);

                return `
                    <article class="post-card" data-post-id="${postId}">
                        <div class="post-header">
                            <div class="post-author-info">
                                <div class="author-avatar">${authorName.charAt(0).toUpperCase()}</div>
                                <span class="author-name">${authorName}</span>
                            </div>
                            <button type="button" class="btn-follow-home">Seguir</button>
                        </div>
                        <div class="post-media-wrapper">
                            ${isVideo ? 
                                `<video src="${item.url}" autoplay loop muted playsinline></video>` : 
                                `<img src="${item.url}" alt="Publicação">`
                            }
                        </div>
                        <div class="post-actions-bar">
                            <div class="post-actions-left">
                                <button type="button" class="post-action-btn" aria-label="Curtir">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                                </button>
                                <button type="button" class="post-action-btn" aria-label="Comentar">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                                </button>
                                <button type="button" class="post-action-btn" aria-label="Compartilhar">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12v-1a7 7 0 0 1 7-7h9"/><polyline points="16 8 20 4 16 0"/></svg>
                                </button>
                            </div>
                        </div>
                        ${caption ? `
                            <div class="post-caption-area">
                                <span class="post-caption-author">${authorName}</span>
                                <span class="post-caption-text">${caption}</span>
                            </div>
                        ` : ''}
                    </article>
                `;
            }).join('');
        }

            renderHom
