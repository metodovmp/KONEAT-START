<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koneat - Home</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* Fundo branco e reset de layout */
        body.light-home-theme {
            background-color: #ffffff;
            color: #000000;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
            padding-bottom: 70px; /* Espaço para a barra inferior */
        }

        /* Header fixo branco */
        .home-header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            z-index: 50;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        }

        .home-logo {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: #000000;
        }

        .home-header-icons {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .icon-top-btn {
            background: none;
            border: none;
            cursor: pointer;
            color: #000000;
            padding: 0;
            display: flex;
            align-items: center;
        }

        /* Abas superiores (Pra você | Seguindo | Explorar) */
        .home-subnav {
            position: fixed;
            top: 52px; left: 0; right: 0;
            height: 44px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 40;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
        }

        .subnav-tab {
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: #8e8e93;
            cursor: pointer;
            position: relative;
            padding: 8px 0;
        }

        .subnav-tab.active {
            color: #000000;
            font-weight: 700;
        }

        .subnav-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: #000000;
        }

        /* Container do Feed com Scroll Liso e Suave */
        .home-feed-container {
            margin-top: 96px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scroll-behavior: smooth; /* Scroll mais suave */
        }

        /* Seção de Stories */
        .stories-bar {
            display: flex;
            gap: 12px;
            padding: 12px 16px;
            overflow-x: auto;
            background: #ffffff;
            border-bottom: 1px solid rgba(0, 0, 0, 0.06);
            scrollbar-width: none;
        }
        .stories-bar::-webkit-scrollbar { display: none; }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .story-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e1e1e6;
            border: 2px solid #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 0 2px #e74c3c;
        }

        .story-add-badge {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 18px;
            height: 18px;
            background: #0095f6;
            color: #ffffff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
            border: 2px solid #ffffff;
        }

        .story-username {
            font-size: 12px;
            color: #262626;
            max-width: 70px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        /* Card de Post / Vídeo na Home */
        .post-card {
            background: #ffffff;
            border-bottom: 1px solid rgba(0, 0, 0, 0.08);
            margin-bottom: 8px;
        }

        .post-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
        }

        .post-author-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .author-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #262626;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 13px;
        }

        .author-name {
            font-size: 14px;
            font-weight: 700;
            color: #000000;
        }

        .btn-follow-home {
            background: #000000;
            color: #ffffff;
            border: none;
            padding: 4px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        /* Mídia do Post (Vídeo ou Imagem) */
        .post-media-wrapper {
            width: 100%;
            max-height: 500px;
            background: #000000;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .post-media-wrapper video,
        .post-media-wrapper img {
            width: 100%;
            max-height: 500px;
            object-fit: contain;
        }

        .post-sound-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            width: 32px;
            height: 32px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 50%;
            border: none;
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* Barra de Ações (Curtir, Comentar, etc.) */
        .post-actions-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 16px;
        }

        .post-actions-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .post-action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            color: #000000;
            display: flex;
            align-items: center;
        }

        .post-caption-area {
            padding: 0 16px 12px 16px;
            font-size: 14px;
            color: #262626;
        }

        .post-caption-author {
            font-weight: 700;
            margin-right: 6px;
        }

        .empty-home-feed {
            text-align: center;
            padding: 60px 20px;
            color: #8e8e93;
            font-size: 15px;
        }

        /* Barra de Navegação Fixa Inferior */
        .bottom-nav-fixed {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            width: 100%; height: 60px;
            background: #ffffff;
            border-top: 1px solid rgba(0, 0, 0, 0.08);
            display: flex;
            align-items: center;
            justify-content: space-around;
            z-index: 999;
            box-sizing: border-box;
            padding: 0 10px;
        }

        .nav-link {
            background: none; border: none; cursor: pointer;
            color: #8e8e93; display: flex; align-items: center;
            justify-content: center; text-decoration: none;
            width: 48px; height: 48px;
        }

        .nav-link.active-home .home-icon-filled { fill: #000000; stroke: #000000; }
    </style>
</head>
<body class="light-home-theme">

    <!-- Header Superior -->
    <header class="home-header">
        <h1 class="home-logo">koneat</h1>
        <div class="home-header-icons">
            <button type="button" class="icon-top-btn" aria-label="Pesquisar">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </button>
            <button type="button" class="icon-top-btn" aria-label="Notificações">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            </button>
        </div>
    </header>

    <!-- Subnav de Abas -->
    <nav class="home-subnav">
        <button type="button" class="subnav-tab active">pra você</button>
        <button type="button" class="subnav-tab">seguindo</button>
        <button type="button" class="subnav-tab">explorar</button>
    </nav>

    <!-- Container Principal do Feed (Scroll Suave) -->
    <main class="home-feed-container" id="homeFeedContainer">
        
        <!-- Barra de Stories -->
        <div class="stories-bar">
            <div class="story-item">
                <div class="story-avatar">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#8e8e93" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    <div class="story-add-badge">+</div>
                </div>
                <span class="story-username">seu story</span>
            </div>
        </div>

        <!-- O Feed de Posts será injetado dinamicamente via JS -->
        <div id="postsDynamicFeed"></div>

    </main>

    <!-- Barra de Navegação Inferior (Home Ativa apontando para o passo4.html) -->
    <nav class="bottom-nav-fixed">
        <a href="./passo4.html" class="nav-link active-home"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path class="home-icon-filled" d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg></a>
        <a href="./criar.html" class="nav-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"></rect><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg></a>
        <a href="./passo2.html" class="nav-link"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"></rect><polygon points="10,8 16,12 10,16" fill="currentColor"></polygon></svg></a>
        <a href="./passo1.html" class="nav-link"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg></a>
    </nav>

    <script>
        const postsDynamicFeed = document.getElementById('postsDynamicFeed');

        function renderHomeFeed() {
            const userPosts = JSON.parse(localStorage.getItem('koneat_user_posts') || '[]');
            const viraisFeed = JSON.parse(localStorage.getItem('koneat_virais_feed') || '[]');
            
            const allPostsMap = new Map();
            [...userPosts, ...viraisFeed].forEach(p => allPostsMap.set(p.id, p));
            const combinedPosts = Array.from(allPostsMap.values());

            if (combinedPosts.length === 0) {
                postsDynamicFeed.innerHTML = `<div class="empty-home-feed">Nenhuma publicação no momento. Crie um post para começar!</div>`;
                return;
            }

            postsDynamicFeed.innerHTML = combinedPosts.map(item => {
                const isVideo = item.type === 'video';
                const authorName = item.author || 'Eributtler';
                const caption = item.caption || '';
                const isLiked = localStorage.getItem(`koneat_like_${item.id}`) === 'true';
                const isSaved = localStorage.getItem(`koneat_save_${item.id}`) === 'true';

                return `
                    <article class="post-card">
                        <div class="post-header">
                            <div class="post-author-info">
                                <div class="author-avatar">${authorName.charAt(0).toUpperCase()}</div>
                                <span class="author-name">${authorName}</span>
                            </div>
                            <button type="button" class="btn-follow-home">Seguir</button>
                        </div>

                        <div class="post-media-wrapper">
                            ${isVideo ? `
                                <video src="${item.url}" autoplay loop muted playsinline style="width: 100%; max-height: 500px; object-fit: contain;"></video>
                                <button type="button" class="post-sound-btn" onclick="togglePostSound(this)">
                                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line></svg>
                                </button>
                            ` : `
                                <img src="${item.url}" alt="Post" />
                            `}
                        </div>

                        <div class="post-actions-bar">
                            <div class="post-actions-left">
                                <button type="button" class="post-action-btn">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="${isLiked ? '#e74c3c' : 'none'}" stroke="${isLiked ? '#e74c3c' : 'currentColor'}" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
                                </button>
                                <button type="button" class="post-action-btn">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                                </button>
                                <button type="button" class="post-action-btn">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                                </button>
                            </div>
                            <button type="button" class="post-action-btn">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="${isSaved ? '#000000' : 'none'}" stroke="currentColor" stroke-width="2"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path></svg>
                            </button>
                        </div>

                        ${caption ? `
                            <div class="post-caption-area">
                                <span class="post-caption-author">${authorName}</span>
                                <span class="post-caption-text">${caption}</span>
                            </div>
                        ` : ''}
                    </article>
                `;
            }).join('');
        }

        function togglePostSound(btn) {
            const video = btn.previousElementSibling;
            if (video && video.tagName === 'VIDEO') {
                video.muted = !video.muted;
                btn.style.opacity = video.muted ? '0.6' : '1';
            }
        }

        renderHomeFeed();
    </script>
</body>
  </html>
